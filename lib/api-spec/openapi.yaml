components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [super_admin, owner, manager, reception, housekeeping]
        organizationId:
          type: integer
          nullable: true
        propertyId:
          type: integer
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - isActive
        - createdAt

    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [owner, manager, reception, housekeeping]
        organizationId:
          type: integer
        propertyId:
          type: integer
          nullable: true
      required:
        - email
        - name
        - password
        - role
        - organizationId

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [owner, manager, reception, housekeeping]
        isActive:
          type: boolean
        propertyId:
          type: integer
          nullable: true

    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [basic, pro, enterprise]
        subscriptionStatus:
          type: string
          enum: [active, trial, suspended, cancelled]
          nullable: true
        maxUnits:
          type: integer
        maxUsers:
          type: integer
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        primaryColor:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        taxRate:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        subscriptionEndsAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        userCount:
          type: integer
          nullable: true
        propertyCount:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - plan
        - maxUnits
        - maxUsers
        - isActive
        - createdAt

    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [basic, pro, enterprise]
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        ownerEmail:
          type: string
          format: email
        ownerName:
          type: string
        ownerPassword:
          type: string
