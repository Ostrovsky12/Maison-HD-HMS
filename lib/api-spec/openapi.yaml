openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HMS - Hotel Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: organizations
    description: Organization management
  - name: properties
    description: Property management
  - name: units
    description: Unit management
  - name: guests
    description: Guest CRM
  - name: bookings
    description: Booking management
  - name: housekeeping
    description: Housekeeping tasks
  - name: notifications
    description: In-app notifications
  - name: rates
    description: Rate management
  - name: addons
    description: Additional services
  - name: payments
    description: Payment management
  - name: analytics
    description: Analytics & reports
  - name: users
    description: User management
  - name: invoices
    description: Invoice management
  - name: audit
    description: Night audit & audit logs
  - name: integrations
    description: OTA channels & webhook integrations
  - name: analytics-advanced
    description: Advanced KPI, forecasting & analytics
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: guide
    description: DOGODA Guest Nature Guide

paths:
  /public/booking-engine/{slug}/draft:
    post:
      operationId: savePublicBookingDraft
      tags: [integrations]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingDraftInput" }
      responses:
        "204": { description: Draft saved without reserving inventory or sending messages }
        "400": { description: Invalid draft }
        "404": { description: Booking page unavailable }
  /booking-engine/drafts:
    get:
      operationId: listBookingDrafts
      tags: [integrations]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: filter, in: query, schema: { type: string, enum: [all, abandoned, new, working, contacted, closed, converted], default: all } }
      responses:
        "200":
          description: Tenant-scoped unfinished booking journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDraftList" }
  /booking-engine/drafts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateBookingDraft
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingDraftUpdate" }
      responses:
        "204": { description: Follow-up status and notes saved }
        "404": { description: Draft not found in this organization }
    delete:
      operationId: deleteBookingDraft
      tags: [integrations]
      responses:
        "204": { description: Contact draft deleted without cancelling any booking }
        "404": { description: Draft not found in this organization }
  /booking-engine/settings:
    get:
      operationId: getBookingEngineSettings
      tags: [integrations]
      responses:
        "200":
          description: Tenant booking module settings without plaintext secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingEngineView" }
    put:
      operationId: saveBookingEngineSettings
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingEngineInput" }
      responses:
        "200":
          description: Saved settings and publication readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingEngineView" }
  /booking-engine/servio:
    get:
      operationId: getBookingServioStatus
      tags: [BookingEngine]
      responses:
        "200":
          description: Current connection check for the saved Servio account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioStatus" }
    post:
      operationId: checkBookingServioConnection
      tags: [BookingEngine]
      responses:
        "200":
          description: Read-only Ping and category access check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioStatus" }
        "400": { description: Missing or invalid saved configuration }
        "403": { description: Administrator access required }
        "409": { description: Configuration changed during the check }
        "429": { description: Too many checks }
  /booking-engine/servio/availability:
    post:
      operationId: searchBookingServioAvailability
      tags: [BookingEngine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingServioSearchInput" }
      responses:
        "200":
          description: Read-only Servio availability and price diagnostic snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioSearchResult" }
        "400": { description: Invalid search or unverified saved connection }
        "403": { description: Administrator access required }
        "404": { description: Organization not found }
        "409": { description: Connection changed during the search }
        "429": { description: Too many searches }
  /booking-engine/servio/preflight:
    post:
      operationId: checkBookingServioPreflight
      tags: [BookingEngine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingServioPreflightInput" }
      responses:
        "200":
          description: Read-only checks of current tariff, seller and payment configuration. Never creates a reservation or a checkout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioPreflight" }
        "400": { description: Invalid selection or unverified saved Servio connection }
        "403": { description: Administrator access required }
        "404": { description: Organization not found }
        "409": { description: Configuration changed during the check }
        "429": { description: Too many checks }
  /booking-engine/overview:
    get:
      operationId: getBookingEngineOverview
      tags: [bookings]
      responses:
        "200":
          description: Real tenant direct bookings, latest fifty
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /booking-engine/servio/reservations:
    get:
      operationId: listBookingServioReservations
      tags: [BookingEngine]
      responses:
        "200":
          description: Latest controlled Servio booking attempts for the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BookingServioReservation" }
    post:
      operationId: createBookingServioReservation
      tags: [BookingEngine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingServioReservationInput" }
      responses:
        "200":
          description: Persisted booking attempt, including explicit uncertain-outcome states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioReservation" }
        "400": { description: Invalid input or tariff }
        "403": { description: Explicit administrator authorization required }
        "409": { description: "Changed selection, price or configuration" }
  /booking-engine/servio/reservations/{id}/checkout:
    post:
      operationId: checkoutBookingServioReservation
      tags: [BookingEngine]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingServioCheckoutInput" }
      responses:
        "200":
          description: Signed LiqPay form for exactly the final Servio bill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioCheckout" }
        "409": { description: Booking is not payable or consent amount changed }
  /booking-engine/servio/reservations/{id}/cancel:
    post:
      operationId: cancelBookingServioReservation
      tags: [BookingEngine]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancellation before any payment link was issued; uncertain cancellation needs manual review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioReservation" }
  /booking-engine/servio/category-media:
    get:
      operationId: getBookingServioCategoryMedia
      tags: [BookingEngine]
      responses:
        "200":
          description: Verified Servio categories with independently stored booking media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioCategoryMediaList" }
    put:
      operationId: saveBookingServioCategoryMedia
      tags: [BookingEngine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingServioCategoryMediaInput" }
      responses:
        "200":
          description: Saved one category without changing accommodation inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioCategoryMediaItem" }
        "409": { description: "Connection, category or saved revision changed" }
  /booking-engine/servio/reservations/{id}/guest-link:
    post:
      operationId: issueBookingServioGuestLink
      tags: [BookingEngine]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingServioGuestLinkInput" }
      responses:
        "200":
          description: Private guest access link issued by an authorized administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioGuestLink" }
        "409": { description: Reservation is not eligible for guest access }
  /public/booking-engine/{slug}/servio/reservations/{id}:
    get:
      operationId: getBookingServioGuestReservation
      tags: [BookingEngine]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Booking-Access, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Minimal guest projection authenticated by the private booking token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioGuestView" }
        "404": { description: Invalid or expired private access }
  /public/booking-engine/{slug}/servio/reservations/{id}/checkout:
    post:
      operationId: checkoutBookingServioGuestReservation
      tags: [BookingEngine]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Booking-Access, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingServioGuestCheckoutInput" }
      responses:
        "200":
          description: Payment of the existing final bill without creating another reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioCheckout" }
        "404": { description: Invalid or expired private access }
        "409": { description: Amount changed or reservation not payable }
  /public/booking-engine/{slug}/servio/search:
    post:
      operationId: searchPublicServioBooking
      tags: [booking-engine]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicServioSearchInput" }
      responses:
        "200":
          description: Authoritative availability and eligible rates; no inventory hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingServioSearchResult" }
  /public/booking-engine/{slug}/servio/reservations:
    post:
      operationId: createPublicServioBooking
      tags: [booking-engine]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicServioReservationInput" }
      responses:
        "200":
          description: Persisted reservation and private final-bill payment page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicServioReservationResult" }
  /public/booking-engine/{slug}:
    get:
      operationId: getPublicBookingEngine
      tags: [bookings]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: preview
          description: Private read-only preview for the same tenant owner or administrator
          schema: { type: boolean }
      responses:
        "200":
          description: Published module branding and real local properties
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /fb/import/poster/preview:
    post:
      operationId: previewPosterMenuImport
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosterMenuImportInput" }
      responses:
        "200":
          description: Read-only catalogue preview, using saved tenant credentials when omitted
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /fb/import/poster/execute:
    post:
      operationId: executePosterMenuImport
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosterMenuImportInput" }
      responses:
        "200":
          description: Explicit import result; credentials are never returned
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /poster/order-bridge:
    get:
      operationId: getPosterOrderBridge
      tags: [integrations]
      responses:
        "200":
          description: Tenant-scoped configuration and local mapping choices, no credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosterOrderBridgeView" }
    put:
      operationId: updatePosterOrderBridge
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosterOrderBridgeInput" }
      responses:
        "200":
          description: Configuration saved; enabling explicitly permits open-order writes only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosterOrderBridgeView" }
  /poster/order-bridge/catalog:
    get:
      operationId: getPosterOrderBridgeCatalog
      tags: [integrations]
      responses:
        "200":
          description: Read-only Poster locations, registers, employees and products
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /poster/order-bridge/orders/{id}:
    get:
      operationId: getPosterOrderBridgeOrder
      tags: [integrations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Persisted order dispatch status; never a print or payment confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosterDispatchResponse" }
  /poster/order-bridge/orders/{id}/send:
    post:
      operationId: sendPosterOrderBridgeOrder
      tags: [integrations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Dispatch result; uncertain writes are held for manual review, not retried
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosterDispatchResponse" }
  /tv/properties/weather:
    get:
      operationId: listTvPropertyWeather
      tags: [TV]
      responses:
        "200":
          description: Weather defaults for properties in the authenticated organization
          content:
            application/json:
              schema:
                type: object
                required: [properties]
                properties:
                  properties:
                    type: array
                    items:
                      $ref: "#/components/schemas/TvPropertyWeather"
        "403":
          description: Organization is required
  /tv/properties/{id}/weather:
    patch:
      operationId: updateTvPropertyWeather
      tags: [TV]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TvWeatherInput"
      responses:
        "200":
          description: Saved weather default
          content:
            application/json:
              schema:
                type: object
                required: [property]
                properties:
                  property:
                    $ref: "#/components/schemas/TvPropertyWeather"
        "400":
          description: Invalid location or coordinates
        "403":
          description: Organization is required
        "404":
          description: Property not found in this organization
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations (Super Admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create organization with owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"

  /organizations/me:
    get:
      operationId: getMyOrganization
      tags: [organizations]
      summary: Get current user's organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{orgId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{orgId}/members:
    get:
      operationId: listOrganizationMembers
      tags: [organizations]
      summary: List organization members
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
    post:
      operationId: inviteOrganizationMember
      tags: [organizations]
      summary: Invite (create) a new staff member
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteMemberResponse"

  /organizations/{orgId}/members/{userId}:
    delete:
      operationId: removeOrganizationMember
      tags: [organizations]
      summary: Deactivate organization member
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Member deactivated

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create property
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
      responses:
        "201":
          description: Property created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{propertyId}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get property
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /units/availability:
    get:
      operationId: getUnitsAvailability
      tags: [units]
      summary: Check units availability for a date range
      security:
        - bearerAuth: []
      parameters:
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: propertyId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Availability results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitAvailabilityResponse"

  /units/categories:
    get:
      operationId: listUnitCategories
      tags: [units]
      summary: List unit categories with counts
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnitCategorySummary"

  /units:
    get:
      operationId: listUnits
      tags: [units]
      summary: List units
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [units]
      summary: Create unit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
      responses:
        "201":
          description: Unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"

  /units/{unitId}:
    get:
