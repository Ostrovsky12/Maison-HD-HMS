<svg width="280" height="64" viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.6" y="1.6" width="60.8" height="30.4" rx="15.2" fill="rgba(255,255,255,0.09)"/>
  <path d="M13.6 48 L13.6 24.8 L32 36.8 L50.4 24.8 L50.4 48" stroke="white" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="8" y1="24.8" x2="19.2" y2="24.8" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="44.8" y1="24.8" x2="56" y2="24.8" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Text: MAISON HD -->
  <text x="78" y="41"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="900"
    font-size="25"
    letter-spacing="-0.5"
    fill="white">MAISON <tspan fill="#a78bfa">HD</tspan></text>

  <!-- Text: Hospitality OS -->
  <text x="80" y="58"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="500"
    font-size="10"
    letter-spacing="2.5"
    fill="rgba(255,255,255,0.4)">HOSPITALITY OS</text>
</svg>
