            schema:
              $ref: '#/components/schemas/LocalPublicBookingInput'
      responses:
        "201":
          description: Pending unpaid booking created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalPublicBookingResult' }
        "200":
          description: Existing booking returned for an identical request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalPublicBookingResult' }
        "400":
          description: Invalid party, dates, contact data or consent
        "409":
          description: Availability, price or request identity conflict
        "503":
          description: Online sales unavailable

  /public/booking-engine/{slug}/checkout:
    post:
      tags: [BookingEngine]
      operationId: createBookingEngineCheckout
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, guestAccessCode, agreeNonRefundable, tariffPolicyVersion]
              properties:
                bookingId: { type: integer, minimum: 1 }
                guestAccessCode: { type: string }
                agreeNonRefundable: { type: boolean }
                tariffPolicyVersion: { type: string }
      responses:
        '200':
          description: Signed 100 percent checkout for the property's own merchant.
          content:
            application/json:
              schema:
                type: object
                required: [data, signature, amount, currency, checkoutUrl, status, bookingRef]
                properties:
                  data: { type: string }
                  signature: { type: string }
                  amount: { type: number }
                  currency: { type: string, enum: [UAH] }
                  checkoutUrl: { type: string }
                  status: { type: string, enum: [awaiting_payment] }
                  bookingRef: { type: string }
        '400': { description: Explicit current tariff consent is required. }
        '404': { description: Booking or guest bearer code not found. }
        '409': { description: Existing payment or changed checkout identity. }
        '410': { description: Reservation payment window expired. }
        '503': { description: Online payment is unavailable. }
  /public/booking-engine/{slug}/payment-status:
    get:
      tags: [BookingEngine]
      operationId: getBookingEnginePaymentStatus
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: query, name: bookingId, required: true, schema: { type: integer } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        '200':
          description: Persisted payment outcome; return URL flags are not proof of payment.
          content:
            application/json:
              schema:
                type: object
                required: [status, paymentStatus, bookingRef, totalAmount, paidAmount, currency]
                properties:
                  status: { type: string, enum: [awaiting_payment, paid, review, expired] }
                  paymentStatus: { type: string, enum: [unpaid, partial, paid] }
                  bookingRef: { type: string }
                  totalAmount: { type: number }
                  paidAmount: { type: number }
                  currency: { type: string, enum: [UAH] }
        '404': { description: Booking or guest bearer code not found. }
  /public/booking-engine/{slug}/liqpay-callback:
    post:
      tags: [BookingEngine]
      operationId: bookingEngineLiqpayCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, signature]
              properties:
                data: { type: string, maxLength: 30000 }
                signature: { type: string }
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200': { description: Callback accepted or successful payment recorded idempotently. }
        '400': { description: "Signature, seller, order, amount or currency mismatch." }
        '503': { description: Payment recording must be retried. }
  /booking-engine/liqpay:
    get:
      tags: [BookingEngine]
      operationId: getBookingLiqpaySettings
      responses:
        '200':
          description: Tenant-owned payment configuration without secret keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingLiqpaySettings' }
    put:
      tags: [BookingEngine]
      operationId: saveBookingLiqpaySettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingLiqpayInput' }
      responses:
        '200':
          description: Saved encrypted merchant keys and property assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingLiqpaySettings' }
        '400': { description: Invalid keys. }
        '403': { description: Owner or administrator required. }
        '404': { description: Property or seller not found in this organization. }
        '409': { description: Resolve outstanding payments before changing merchant keys. }
  /booking-engine/liqpay/check:
    post:
      tags: [BookingEngine]
      operationId: checkBookingLiqpayConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingLiqpayCheckInput' }
      responses:
        '200':
          description: Read-only LiqPay authentication result without making a payment.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/BookingLiqpayVerification' }
                  - type: object
                    required: [message]
                    properties:
                      message: { type: string }
        '400': { description: Save both merchant keys first. }
        '403': { description: Owner or administrator required. }
        '404': { description: Seller not found in this organization. }
        '409': { description: Keys changed during the check. }
  /booking-engine/media-upload:
    post:
      tags: [BookingEngine]
      operationId: requestBookingMediaUpload
      security: [{ bearerAuth: [] }]
      summary: Upload accommodation presentation media without changing PMS inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Upload URL for an authorized hotel operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Unsupported file type or size.
        '403':
          description: Hotel operator access required.
        '409':
          description: Servio inventory mapping is not yet verified.
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary

